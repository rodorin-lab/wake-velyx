name: wake-velyx-studio

# Scheduled wake (hourly, offset from :00 to dodge GitHub's cron rush) +
# on-demand wake via "Run workflow" button or `gh workflow run`.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch: {}

concurrency:
  group: wake-studio
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Lightning SDK
        run: pip install lightning-sdk

      - name: Wake studio (idempotent)
        env:
          LIGHTNING_USER_ID: ${{ secrets.LIGHTNING_USER_ID }}
          LIGHTNING_API_KEY: ${{ secrets.LIGHTNING_API_KEY }}
          WAKE_STUDIO_NAME: velyx-hermes
          WAKE_TEAMSPACE: general
          WAKE_ORG: rodorin-labs
          WAKE_MACHINE: CPU
        run: python scripts/wake_studio.py